<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导出导入测试</title>
    <style>
        body { padding: 20px; font-family: system-ui; }
        button { margin: 10px; padding: 8px 20px; }
    </style>
</head>
<body>
<h3>导出 / 导入 测试</h3>
<button id="exportBtn">📤 导出备份</button>
<button id="importBtn">📥 导入备份</button>
<input type="file" id="importFileInput" accept=".json" style="display: none;">

<script>
    const STORAGE_KEY = 'test_export_import';
    let testData = { msg: 'hello', time: Date.now() };

    // 保存测试数据
    localStorage.setItem(STORAGE_KEY, JSON.stringify(testData));

    // 导出
    document.getElementById('exportBtn').addEventListener('click', () => {
        const data = localStorage.getItem(STORAGE_KEY);
        if (!data) return alert('无数据');

        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup_${Date.now()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        alert('✅ 导出完成，请检查下载文件夹');
    });

    // 导入
    const fileInput = document.getElementById('importFileInput');
    document.getElementById('importBtn').addEventListener('click', () => {
        fileInput.click();
    });

    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const imported = JSON.parse(ev.target.result);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(imported));
                alert('✅ 导入成功，数据已恢复');
                console.log('导入内容:', imported);
            } catch (err) {
                alert('❌ 文件格式错误');
            }
        };
        reader.readAsText(file);
        fileInput.value = ''; // 清空，允许重复导入同一文件
    });
</script>
</body>
</html>
