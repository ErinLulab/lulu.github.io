<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LuluList 布局验证</title>
    <style>
        body { background: #f3f4f6; font-family: system-ui; padding: 16px; }
        .dashboard { max-width: 700px; margin: 0 auto; background: white; border-radius: 12px; padding: 20px; }
        .date-bar { background: #fef3c7; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .date-row-top { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
        .date-range-hint { background: #ffedd5; padding: 6px; border-radius: 6px; font-size: 0.75rem; text-align: left; }
        .todo-item { background: #f9fafb; padding: 12px; border-radius: 8px; margin-top: 12px; }
        .todo-row-top { display: flex; gap: 10px; margin-bottom: 8px; }
        .todo-row-bottom { display: flex; justify-content: space-between; align-items: center; }
        .todo-actions { display: flex; gap: 8px; }
    </style>
</head>
<body>
<div class="dashboard">
    <!-- 日期区：两行 -->
    <div class="date-bar">
        <div class="date-row-top">
            <span>📅 选择日期：</span>
            <input type="date" value="2026-05-21">
            <button>前往</button>
        </div>
        <div class="date-range-hint">📆 近30天</div>
    </div>

    <!-- 待办区：强制两行 -->
    <div class="todo-item">
        <div class="todo-row-top">
            <input type="checkbox"> 买簇绒枪
        </div>
        <div class="todo-row-bottom">
            <span>📅 2026-05-23</span>
            <div class="todo-actions">
                <button>✏️</button>
                <button>🗑️</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
