<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LuluList · 图表测试版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body { background: #f3f4f6; font-family: system-ui; padding: 16px; }
        .dashboard { max-width: 600px; margin: 0 auto; background: white; border-radius: 20px; padding: 20px; }
        button { background: #f97316; border: none; padding: 10px 16px; border-radius: 40px; color: white; font-weight: 600; margin-top: 20px; width: 100%; }
        .chart-container { margin-top: 20px; display: none; }
        .chart-container.show { display: block; }
        canvas { max-height: 250px; width: 100%; }
    </style>
</head>
<body>
<div class="dashboard">
    <h2>📒 LuluList · 图表测试</h2>
    <button id="statsBtn">📊 统计</button>
    <div id="chartContainer" class="chart-container">
        <canvas id="moodChart"></canvas>
    </div>
</div>

<script>
    (function() {
        // 模拟 journal 数据（近7天心情）
        const today = new Date();
        const fakeJournal = {};

        for (let i = 0; i <= 6; i++) {
            const d = new Date();
            d.setDate(today.getDate() - i);
            const dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            // 随机心情：有记录 / 无记录交替，方便看断开效果
            if (i !== 2 && i !== 5) {
                fakeJournal[dateStr] = { mood: Math.floor(Math.random() * 5) + 1, _hasUserRated: true };
            }
        }

        function getLast7Days() {
            const days = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(today.getDate() - i);
                days.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
            }
            return days;
        }

        function renderChart() {
            const days = getLast7Days();
            const labels = [];
            const moodValues = [];

            days.forEach(date => {
                labels.push(date.slice(5));
                const mood = fakeJournal[date]?.mood;
                moodValues.push(mood !== undefined && fakeJournal[date]?._hasUserRated ? mood : null);
            });

            const ctx = document.getElementById('moodChart').getContext('2d');
            if (window.moodChartInstance) window.moodChartInstance.destroy();

            window.moodChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '心情值',
                        data: moodValues,
                        borderColor: '#f97316',
                        borderWidth: 2,
                        pointRadius: 4,
                        spanGaps: false,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { min: 1, max: 5, stepSize: 1 } }
                }
            });
        }

        const statsBtn = document.getElementById('statsBtn');
        const chartContainer = document.getElementById('chartContainer');

        statsBtn.addEventListener('click', () => {
            if (chartContainer.classList.contains('show')) {
                chartContainer.classList.remove('show');
                statsBtn.textContent = '📊 统计';
            } else {
                renderChart();
                chartContainer.classList.add('show');
                statsBtn.textContent = '📊 收起图表';
            }
        });
    })();
</script>
</body>
</html>
