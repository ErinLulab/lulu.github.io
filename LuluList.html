<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>LuluList · 我的电子手账</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LuluList">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background: #f3f4f6;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .dashboard {
            max-width: 700px;
            width: 100%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2);
            padding: 20px 16px 24px;
            transition: opacity 0.2s;
        }
        .dashboard.fade-out { opacity: 0; }

        .app-header { text-align: center; margin-bottom: 16px; }
        .app-title { font-size: 1.6rem; font-weight: 600; color: #f97316; }
        .app-sub { font-size: 0.7rem; color: #9ca3af; }

        /* DateBar - 垂直排列，各自成行 */
        .date-bar {
            background: #fef3c7;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .date-label { font-weight: 500; color: #92400e; font-size: 0.85rem; }
        .date-picker {
            padding: 10px;
            font-size: 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: white;
            width: 100%;
        }
        .date-go-button {
            background: #f97316;
            border: none;
            padding: 10px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
        }
        .date-range-hint {
            font-size: 0.55rem;
            color: #92400e;
            background: #ffedd5;
            padding: 6px 10px;
            border-radius: 6px;
            text-align: center;
        }

        .date-badge {
            text-align: center;
            margin: 12px 0 16px;
            padding: 10px 16px;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border-radius: 12px;
            font-weight: 600;
            color: #92400e;
            font-size: 0.9rem;
        }

        .mood-card {
            background: #fef2f2;
            border-radius: 10px;
            padding: 12px 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .mood-label { font-weight: 600; color: #dc2626; font-size: 0.9rem; }
        .mood-stars { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .star { font-size: 1.6rem; cursor: pointer; color: #d1d5db; padding: 2px; }
        .star.active { color: #fbbf24; }
        .star.default-star { color: #9ca3af; border: 1px dashed #d1d5db; border-radius: 6px; padding: 2px; font-size: 1.3rem; }
        .mood-hint { font-size: 0.65rem; color: #9ca3af; }

        .diary-card { margin-bottom: 20px; }
        .diary-label { font-weight: 600; margin-bottom: 6px; color: #374151; font-size: 0.9rem; }
        .diary-textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
        }
        .diary-empty-hint { color: #9ca3af; text-align: center; padding: 10px; background: #f9fafb; border-radius: 8px; margin-top: 8px; font-size: 0.75rem; }

        .todo-card { margin-top: 16px; }
        .todo-header { margin-bottom: 10px; }
        .todo-title { font-weight: 600; font-size: 0.95rem; }

        .todo-add-bar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }
        .todo-text-input, .todo-due-picker {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            border: 1px solid #d1d5db;
            background: white;
        }
        .todo-add-button {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
            background: #f97316;
            border: none;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .todo-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .todo-item {
            background: #f9fafb;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .todo-row-top {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .todo-check { width: 20px; height: 20px; accent-color: #f97316; flex-shrink: 0; }
        .todo-text {
            flex: 1;
            font-size: 0.9rem;
            word-break: break-word;
            line-height: 1.4;
        }
        .todo-row-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .todo-due-date {
            font-size: 0.7rem;
            background: #e5e7eb;
            padding: 4px 10px;
            border-radius: 30px;
            white-space: nowrap;
        }
        .todo-actions {
            display: flex;
            gap: 4px;
        }

            background
