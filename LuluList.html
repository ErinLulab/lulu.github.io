<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>LuluList 布局测试</title>
    <style>
        body { background: #f3f4f6; padding: 16px; font-family: system-ui; }
        .card { max-width: 600px; background: white; margin: 0 auto; border-radius: 16px; padding: 20px; }
        
        /* DateBar 两行布局 */
        .date-bar { background: #fef3c7; padding: 12px; border-radius: 12px; margin-bottom: 12px; }
        .date-row-top { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; align-items: center; }
        .date-picker { padding: 8px; border-radius: 8px; border: 1px solid #ccc; flex: 1; }
        .date-go-button { background: #f97316; border: none; padding: 8px 16px; border-radius: 8px; color: white; }
        .date-range-hint { font-size: 0.8rem; color: #92400e; background: #ffedd5; padding: 6px; border-radius: 6px; text-align: left; }
        
        /* TodoItem 强制两行 */
        .todo-item { background: #f9fafb; padding: 12px; border-radius: 12px; margin-top: 12px; border: 1px solid #eee; }
        .todo-row-top { display: flex; gap: 10px; margin-bottom: 8px; }
        .todo-row-bottom { display: flex; justify-content: space-between; }
        .todo-actions { display: flex; gap: 8px; }
    </style>
</head>
<body>
<div class="card">
    <div class="date-bar">
        <div class="date-row-top">
            <span>📅 选择日期：</span>
            <input type="date" class="date-picker" value="2026-05-21">
            <button class="date-go-button">前往</button>
        </div>
        <div class="date-range-hint">📆 近30天</div>
    </div>

    <div class="todo-item">
        <div class="todo-row-top">
            <input type="checkbox"> 买簇绒枪
        </div>
        <div class="todo-row-bottom">
            <span>📅 2026-05-23</span>
            <div class="todo-actions">
                <button>✏️</button>
                <button>🗑️</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
